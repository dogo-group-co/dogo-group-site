<div class="site-shell">
  <header class="site-shell__header">
    <a class="site-shell__brand" routerLink="/" (click)="closeMenu()">
      <img src="images/logo.svg" [alt]="'brand' | translate">
      <span>{{ 'brand' | translate }}</span>
    </a>
    <button class="site-shell__menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="primary-navigation"><mat-icon class="material-symbols-outlined" aria-hidden="true">menu</mat-icon><span class="site-shell__sr-only">{{ 'navigation.openMenu' | translate }}</span></button>
    <nav id="primary-navigation" class="site-shell__navigation" [class.site-shell__navigation--open]="menuOpen()" [attr.aria-label]="'navigation.label' | translate"><a routerLink="/" routerLinkActive="site-shell__link--active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">{{ 'navigation.home' | translate }}</a><a routerLink="/explorar" routerLinkActive="site-shell__link--active" (click)="closeMenu()">{{ 'navigation.explore' | translate }}</a><a routerLink="/ninos" routerLinkActive="site-shell__link--active" (click)="closeMenu()">{{ 'navigation.children' | translate }}</a><a routerLink="/adultos" routerLinkActive="site-shell__link--active" (click)="closeMenu()">{{ 'navigation.adults' | translate }}</a><a routerLink="/examenes" routerLinkActive="site-shell__link--active" (click)="closeMenu()">{{ 'navigation.exams' | translate }}</a></nav>
  </header>
  <router-outlet />
  <footer class="site-shell__footer"><span>{{ 'footer.copyright' | translate }}</span></footer>
</div>
